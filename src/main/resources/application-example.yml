# Example configuration - Copy to application.yml and fill in your details

spring:
  application:
    name: glycoforge
  datasource:
    url: jdbc:mysql://localhost:3306/glycoforge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: user # Replace with your MySQL username (from docker-compose.yml)
    password: password # Replace with your MySQL password (from docker-compose.yml)
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema management
    show-sql: true # Set to false in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Thymeleaf configuration (defaults are usually fine)
  thymeleaf:
    cache: false # Disable cache for development

# Flyway configuration
  flyway:
    enabled: true
    locations: classpath:db/migration # Location of SQL migration scripts

# JWT Configuration (Example - Externalize secret in production!)
jwt:
  secret: ReplaceThisWithAStrongBase64EncodedSecretKeyAtLeast512BitsLong # Generate a strong secret key
  expiration:
    ms: 900000 # 15 minutes

# Llama.cpp Server Endpoint (Placeholder)
llama:
  endpoint: http://localhost:8000/completion # Adjust if your llama.cpp server runs elsewhere or has a different endpoint

server:
  port: 8080

logging:
  level:
    root: INFO
    com.glycoforge: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG # Log SQL statements
    org.hibernate.type.descriptor.sql: TRACE # Log SQL parameters

