<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GlycoForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login to GlycoForge</h2>
        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Login
                </button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">Register here</a>
        </p>
        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <!-- Basic JS for form submission -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = ''; // Clear previous messages

            const formData = {
                email: document.getElementById('email').value,
                pwd: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                if (response.ok) {
                    const data = await response.json();
                    // Store the token (e.g., in localStorage)
                    localStorage.setItem('jwtToken', data.token);
                    messageDiv.textContent = 'Login successful! Redirecting to dashboard...';
                    messageDiv.className = 'mt-4 text-center text-sm text-green-600';
                    // Redirect to dashboard
                    setTimeout(() => {
                         window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    messageDiv.textContent = 'Login failed: Invalid email or password.';
                    messageDiv.className = 'mt-4 text-center text-sm text-red-600';
                }
            } catch (error) {
                console.error('Error during login:', error);
                messageDiv.textContent = 'An error occurred during login. Please try again.';
                messageDiv.className = 'mt-4 text-center text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
