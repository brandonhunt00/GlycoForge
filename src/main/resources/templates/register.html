<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GlycoForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Optional: Configure Tailwind via script tag if needed -->
    <!-- <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: '#da373d',
            }
          }
        }
      }
    </script> -->
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Register for GlycoForge</h2>
        <!-- Registration Form -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700">Age:</label>
                    <input type="number" id="age" name="age" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="heightCm" class="block text-sm font-medium text-gray-700">Height (cm):</label>
                    <input type="number" id="heightCm" name="heightCm" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="weightKg" class="block text-sm font-medium text-gray-700">Weight (kg):</label>
                    <input type="number" step="0.1" id="weightKg" name="weightKg" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="insulinRatio" class="block text-sm font-medium text-gray-700">Insulin Ratio (Units/10g Carbs):</label>
                    <input type="number" step="0.1" id="insulinRatio" name="insulinRatio" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div class="md:col-span-2">
                    <label for="sensitivityFactor" class="block text-sm font-medium text-gray-700">Sensitivity Factor (mg/dL per Unit):</label>
                    <input type="number" step="0.1" id="sensitivityFactor" name="sensitivityFactor" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>
            <div>
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Register
                </button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Login here</a>
        </p>
        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <!-- Basic JS for form submission -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = ''; // Clear previous messages

            const formData = {
                email: document.getElementById('email').value,
                pwd: document.getElementById('password').value,
                age: parseInt(document.getElementById('age').value),
                heightCm: parseInt(document.getElementById('heightCm').value),
                weightKg: parseFloat(document.getElementById('weightKg').value),
                insulinRatio: parseFloat(document.getElementById('insulinRatio').value),
                sensitivityFactor: parseFloat(document.getElementById('sensitivityFactor').value)
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                if (response.ok) {
                    messageDiv.textContent = 'Registration successful! Redirecting to login...';
                    messageDiv.className = 'mt-4 text-center text-sm text-green-600';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    const errorText = await response.text();
                    messageDiv.textContent = `Registration failed: ${errorText}`;
                    messageDiv.className = 'mt-4 text-center text-sm text-red-600';
                }
            } catch (error) {
                console.error('Error during registration:', error);
                messageDiv.textContent = 'An error occurred during registration. Please try again.';
                messageDiv.className = 'mt-4 text-center text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
